name: Release

# Publica el ejecutable de Windows en la pestaña "Releases" al subir una etiqueta de versión:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# También se puede lanzar a mano desde la pestaña "Actions" (Run workflow): en ese caso compila,
# prueba y deja el .zip como artefacto de la ejecución, pero NO crea ninguna Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release con el GITHUB_TOKEN del propio flujo

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Si las pruebas fallan, no se publica nada.
      - name: Test
        run: dotnet test DiskSpaceAnalyzer.sln --configuration Release

      - name: Publish self-contained executable
        run: >
          dotnet publish src/DiskSpaceAnalyzer.Desktop
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}
          --output publish

      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = "DiskSpaceAnalyzer-v${{ steps.version.outputs.value }}-win-x64.zip"
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item publish/DiskSpaceAnalyzer.Desktop.exe staging/DiskSpaceAnalyzer.exe
          Compress-Archive -Path staging/DiskSpaceAnalyzer.exe -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Una etiqueta con guion (v1.0.0-beta) se marca como versión preliminar.
          flags=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Disk Space Analyzer $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $flags
