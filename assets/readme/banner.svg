<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Disk Space Analyzer</title>
  <desc id="d">Aplicación de escritorio que muestra qué carpetas y archivos ocupan más espacio en el disco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202026"/><stop offset="1" stop-color="#0B0B0E"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#F0563C" stop-opacity=".38"/><stop offset="1" stop-color="#F0563C" stop-opacity="0"/></radialGradient>
    <radialGradient id="bannerGlow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#F0563C" stop-opacity=".22"/><stop offset="1" stop-color="#F0563C" stop-opacity="0"/></radialGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5A32E"/><stop offset="1" stop-color="#C98418"/></linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD983"/><stop offset="1" stop-color="#F5B84B"/></linearGradient>
    <linearGradient id="coralH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0563C"/><stop offset="1" stop-color="#FF9A6B"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4F4F5"/><stop offset="1" stop-color="#FFC2A6"/></linearGradient>
    <g id="folder">
      <path d="M0 4a3 3 0 0 1 3-3h6l3 3h10a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" fill="#F5B84B"/>
    </g>
  </defs>

  <!-- Fondo propio: el banner se ve igual en el tema claro y en el oscuro de GitHub -->
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="#09090B" stroke="#27272A" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#bannerGlow)"/>

  <!-- Icono -->
  <g transform="translate(60 112) scale(0.5)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
    <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#3F3F46" stroke-opacity=".75" stroke-width="2"/>
    <path d="M34 84a16 16 0 0 1 16-16h42a12 12 0 0 1 8.5 3.5L116 84h90a16 16 0 0 1 16 16v86a16 16 0 0 1-16 16H50a16 16 0 0 1-16-16z" fill="url(#folderBack)"/>
    <rect x="30" y="102" width="196" height="100" rx="18" fill="#000" fill-opacity=".28" transform="translate(0 6)"/>
    <rect x="30" y="102" width="196" height="100" rx="18" fill="url(#folderFront)"/>
    <path d="M48 103h160" stroke="#FFF1CC" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    <rect x="54" y="150" width="148" height="20" rx="10" fill="#7A4A00" fill-opacity=".38"/>
    <rect x="54" y="150" width="104" height="20" rx="10" fill="url(#coralH)"/>
  </g>

  <!-- Texto -->
  <text x="216" y="156" font-size="56" font-weight="700" fill="url(#title)" letter-spacing="-1">Disk Space Analyzer</text>
  <text x="216" y="196" font-size="22" fill="#A1A1AA">Descubre qué carpetas y archivos ocupan tu disco.</text>
  <rect x="216" y="222" width="92" height="32" rx="16" fill="#18181B" stroke="#27272A"/><text x="262.0" y="243" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">.NET 10</text><rect x="320" y="222" width="122" height="32" rx="16" fill="#18181B" stroke="#27272A"/><text x="381.0" y="243" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">Avalonia 12</text><rect x="454" y="222" width="126" height="32" rx="16" fill="#18181B" stroke="#27272A"/><text x="517.0" y="243" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">Solo lectura</text>

  <!-- Vista previa de la app -->
  <g transform="translate(790 32)">
    <rect width="428" height="296" rx="20" fill="#111113" stroke="#27272A"/>
    <text x="24" y="40" font-size="11" font-weight="500" letter-spacing="1.2" fill="#71717A">CARPETA ANALIZADA</text>
    <rect x="24" y="52" width="380" height="36" rx="10" fill="#18181B" stroke="#27272A"/>
    <text x="40" y="75" font-size="14" fill="#A1A1AA" font-family="'Cascadia Mono', Consolas, Menlo, monospace">D:\</text>
    <g transform="translate(0 -14)">
    <g transform="translate(0 116)">
      <use href="#folder" x="24" y="2"/>
      <text x="58" y="15" font-size="15" font-weight="600" fill="#F4F4F5">Videos</text>
      <text x="380" y="15" font-size="14" fill="#A1A1AA" text-anchor="end">48,2 GB</text>
      <rect x="58" y="26" width="322" height="6" rx="3" fill="#27272A"/>
      <rect x="58" y="26" width="264" height="6" rx="3" fill="url(#coralH)"/>
    </g>
    <g transform="translate(0 164)">
      <use href="#folder" x="24" y="2"/>
      <text x="58" y="15" font-size="15" font-weight="600" fill="#F4F4F5">Proyectos</text>
      <text x="380" y="15" font-size="14" fill="#A1A1AA" text-anchor="end">9,6 GB</text>
      <rect x="58" y="26" width="322" height="6" rx="3" fill="#27272A"/>
      <rect x="58" y="26" width="109" height="6" rx="3" fill="url(#coralH)"/>
    </g>
    <g transform="translate(0 212)">
      <use href="#folder" x="24" y="2"/>
      <text x="58" y="15" font-size="15" font-weight="600" fill="#F4F4F5">Descargas</text>
      <text x="380" y="15" font-size="14" fill="#A1A1AA" text-anchor="end">4,1 GB</text>
      <rect x="58" y="26" width="322" height="6" rx="3" fill="#27272A"/>
      <rect x="58" y="26" width="55" height="6" rx="3" fill="url(#coralH)"/>
    </g>
    <g transform="translate(0 260)">
      <use href="#folder" x="24" y="2"/>
      <text x="58" y="15" font-size="15" font-weight="600" fill="#F4F4F5">Documentos</text>
      <text x="380" y="15" font-size="14" fill="#A1A1AA" text-anchor="end">1,3 GB</text>
      <rect x="58" y="26" width="322" height="6" rx="3" fill="#27272A"/>
      <rect x="58" y="26" width="23" height="6" rx="3" fill="url(#coralH)"/>
    </g>
    </g>
  </g>
</svg>
